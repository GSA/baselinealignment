title: ICT Baseline Alignment Framework
email: ictbaseline@gsa.gov
description: >-
  The ICT Baseline Alignment Framework provides test cases and guidance
  for evaluating whether accessibility test processes produce results
  consistent with the ICT Testing Baseline for Web.

baseurl: /baselinealignment

primary_navigation:
  - name: Baseline Alignment Home
    url: /
  - name: Test Cases
    url: /testcases.html
  - name: Evaluate a Test Process
    url: /evaluating-test-processes.html
  - name: Reporting Tool
    children:
      - name: Reporting Tool
        url: /reporting-tool.html
      - name: Reporting Tool Guide
        url: /reporting-guide.html
  - name: Accessibility SI Resources
    url: /accessibility-si.html
  - name: Contributing
    url: /contributing.html
  - name: ICT Baseline
    url: https://ictbaseline.access-board.gov/
    ext: true

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - package.json
  - package-lock.json
  - README.md
  - CONTRIBUTING.md
  - LICENSE.md
  - degit.json
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - CODEOWNERS
  - Templates/_testcase-template.md
  - Templates/_BAWG-Tmpl-01.dwt
  - evaluations/scripts
  - evaluations/tests
  # Maintainer documentation and portable source resources are repository-only.
  - "**/README.md"
  - reporting-tool/
  - accessibility-si/
  - evaluations/coverage.md
  - evaluations/publication-and-coverage.md
  - evaluations/validation-status.md
