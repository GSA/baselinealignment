<!DOCTYPE html>
    <head>
        <meta charset="utf-8">
        <title>21.A-1.a-pass-1</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.ticket-container {
    text-align: center;
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
}

button:disabled {
    background-color: gray;
    cursor: not-allowed;
}
    </style>
    
</head>
<body>
    <div class="ticket-container">
        <h1>Select Your Seats</h1>
        <p>You have <span id="time-limit">2:00</span> minutes to confirm your purchase.</p>
        <button id="turn-off-timer">Turn Off Timer</button>
        <button id="confirm">Confirm Purchase</button>
    </div>
    <script> 
let timeLimit = 120; // 2 minutes (in seconds)
let timer;

function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;
    return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
}

function updateTimer() {
    document.getElementById('time-limit').textContent = formatTime(timeLimit);
}

function startTimer() {
    timer = setInterval(() => {
        timeLimit--;
        updateTimer();
        if (timeLimit <= 0) {
            clearInterval(timer);
            alert('Time limit expired. Please refresh the page to start again.');
        }
    }, 1000);
}

function turnOffTimer() {
    clearInterval(timer);
    document.getElementById('time-limit').textContent = 'Disabled';
    document.getElementById('turn-off-timer').disabled = true;
}

document.getElementById('turn-off-timer').addEventListener('click', turnOffTimer);

// Start the timer when the page loads
startTimer();

    </script>
</body>
</html>
