{
  "schema_version": "0.2.0",
  "development_target": "WCAG-2.2-A-AA",
  "criteria": [
    {
      "id": "1.1.1",
      "name": "Non-text Content",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#non-text-content",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html",
      "document_section508_applicability": "content-dependent",
      "development": "Give meaningful graphics equivalent alternatives; make decoration ignorable; name controls and provide appropriate alternatives for complex images and CAPTCHA.",
      "testing": "Compare every image, chart, icon and non-text object with its exposed name/description and surrounding content; check purpose, decorative handling and criterion exceptions.",
      "document_notes": "Use native alternative-text/decorative or PDF artifact mechanisms; give complex charts equivalent narrative or accessible data. An empty cell is not itself an accessibility failure.",
      "web_baseline_procedures": [
        "6.A-MeaningfulImage",
        "6.B-DecorativeImage",
        "6.C-Captcha",
        "7.C-AudibleCues",
        "10.A-FormName"
      ],
      "documents_baseline_procedures": [
        "6.A-MeaningfulImage",
        "6.B-DecorativeImage",
        "7.C-AudibleCues",
        "10.A-FormName"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#text-equiv-all"
    },
    {
      "id": "1.2.1",
      "name": "Audio-only and Video-only (Prerecorded)",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#audio-only-and-video-only-prerecorded",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/audio-only-and-video-only-prerecorded.html",
      "document_section508_applicability": "content-dependent",
      "development": "Provide an equivalent transcript for prerecorded audio-only and an equivalent text or audio alternative for prerecorded video-only, subject to the text-alternative exception.",
      "testing": "Compare the entire recording with its alternative; include relevant sounds, speaker identity and visual information as appropriate.",
      "document_notes": "Include linked and embedded recordings, not just visible document text.",
      "web_baseline_procedures": [
        "16.A-AudioOnlyTranscript",
        "16.B-VideoOnlyAlt",
        "16.C-AudioMediaAlternative",
        "16.D-VideoMediaAlternative"
      ],
      "documents_baseline_procedures": [
        "16.A-AudioOnlyTranscript",
        "16.B-VideoOnlyAlt",
        "16.C-AudioMediaAlternative",
        "16.D-VideoMediaAlternative"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#media-equiv-av-only-alt"
    },
    {
      "id": "1.2.2",
      "name": "Captions (Prerecorded)",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#captions-prerecorded",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html",
      "document_section508_applicability": "content-dependent",
      "development": "Provide accurate synchronized captions for prerecorded synchronized media, subject to the labeled text-alternative exception.",
      "testing": "Play the full media with captions; compare speech, meaningful sounds, timing and placement.",
      "document_notes": "A slide transcript alone does not replace synchronized captions.",
      "web_baseline_procedures": [
        "17.D-CaptionsPrerecorded"
      ],
      "documents_baseline_procedures": [
        "17.D-CaptionsPrerecorded"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#media-equiv-captions"
    },
    {
      "id": "1.2.3",
      "name": "Audio Description or Media Alternative (Prerecorded)",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#audio-description-or-media-alternative-prerecorded",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/audio-description-or-media-alternative-prerecorded.html",
      "document_section508_applicability": "content-dependent",
      "development": "Provide audio description or an equivalent time-based media alternative for prerecorded synchronized media under the Level A rule.",
      "testing": "Check the Level A alternative and its exception; at AA also evaluate the stricter audio-description requirement of 1.2.5.",
      "document_notes": "The Baselines use 1.2.5 for AA rather than a separate 1.2.3 outcome; retain this relationship in coverage records.",
      "web_baseline_procedures": [
        "17.G-SyncMediaAlternative"
      ],
      "documents_baseline_procedures": [
        "17.G-SyncMediaAlternative"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#media-equiv-audio-desc"
    },
    {
      "id": "1.2.4",
      "name": "Captions (Live)",
      "level": "AA",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#captions-live",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/captions-live.html",
      "document_section508_applicability": "content-dependent",
      "development": "Provide synchronized captions for live synchronized media.",
      "testing": "Observe the live broadcast and compare captions with speech and meaningful sounds; distinguish broadcasts from excluded two-way calls in the Baseline.",
      "document_notes": "Record the live delivery environment; a static document without live media can have a justified non-applicability finding.",
      "web_baseline_procedures": [
        "17.F-CaptionsLive"
      ],
      "documents_baseline_procedures": [
        "17.F-CaptionsLive"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#media-equiv-real-time-captions"
    },
    {
      "id": "1.2.5",
      "name": "Audio Description (Prerecorded)",
      "level": "AA",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#audio-description-prerecorded",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/audio-description-prerecorded.html",
      "document_section508_applicability": "content-dependent",
      "development": "Describe important prerecorded visual information not already conveyed in the soundtrack.",
      "testing": "Play the entire synchronized recording with description enabled; compare meaningful actions, changes, graphics and on-screen text.",
      "document_notes": "Include exported narrated slide presentations and their delivered playback versions.",
      "web_baseline_procedures": [
        "17.E-ADPrerecorded"
      ],
      "documents_baseline_procedures": [
        "17.E-ADPrerecorded"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#media-equiv-audio-desc-only"
    },
    {
      "id": "1.3.1",
      "name": "Info and Relationships",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#info-and-relationships",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html",
      "document_section508_applicability": "content-dependent",
      "development": "Represent headings, lists, labels, table relationships and other visually conveyed structure programmatically or in text.",
      "testing": "Compare visual relationships with the accessibility tree or native structure and assistive technology output; evaluate all meaningful structures.",
      "document_notes": "Use styles, native lists, table headers, chart alternatives and PDF structure. Assess merged cells by actual header relationships and navigation, not a blanket prohibition.",
      "web_baseline_procedures": [
        "10.A-FormName",
        "12.A-DataTableRole",
        "12.B-DataTableHeaderAssociation",
        "13.B-VisHeadingProg",
        "13.C-ProgHeadingVisual",
        "13.D-List"
      ],
      "documents_baseline_procedures": [
        "10.A-FormName",
        "12.A-DataTableRole",
        "12.B-DataTableHeaderAssociation",
        "13.B-VisHeadingProg",
        "13.C-ProgHeadingVisual",
        "13.D-List",
        "18.A-MeaningfulContent"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#content-structure-separation-programmatic"
    },
    {
      "id": "1.3.2",
      "name": "Meaningful Sequence",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#meaningful-sequence",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/meaningful-sequence.html",
      "document_section508_applicability": "content-dependent",
      "development": "Keep a meaningful reading sequence in both presentation and programmatic order.",
      "testing": "Read complex layouts in their exposed sequence; compare the meaning with the visual layout, including positioned or floating content.",
      "document_notes": "Inspect Word object anchors, Excel navigation, PowerPoint object order and PDF tag order independently of visual coordinates.",
      "web_baseline_procedures": [
        "18.B-CSSPositionedContent"
      ],
      "documents_baseline_procedures": [
        "18.B-MeaningfulSequence"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#content-structure-separation-sequence"
    },
    {
      "id": "1.3.3",
      "name": "Sensory Characteristics",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#sensory-characteristics",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/sensory-characteristics.html",
      "document_section508_applicability": "content-dependent",
      "development": "Write instructions that do not rely solely on position, shape, size, sound or orientation.",
      "testing": "Follow each instruction without relying on the cited sensory property and check for a text/name equivalent.",
      "document_notes": "Identify worksheet cells, slides and controls with meaningful names or text as well as spatial cues.",
      "web_baseline_procedures": [
        "7.B-SensoryCharacteristics"
      ],
      "documents_baseline_procedures": [
        "7.B-SensoryCharacteristics"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#content-structure-separation-understanding"
    },
    {
      "id": "1.3.4",
      "name": "Orientation",
      "level": "AA",
      "introduced_in": "2.1",
      "track": "supplemental-wcag21",
      "normative_url": "https://www.w3.org/TR/WCAG22/#orientation",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/orientation.html",
      "document_section508_applicability": "supplemental-with-WCAG2ICT-interpretation",
      "development": "Support portrait and landscape unless one orientation is essential.",
      "testing": "Rotate or change the display orientation and check access and operation; substantiate the essential-orientation exception.",
      "document_notes": "A printed page's portrait layout is not the same as locking device orientation; evaluate the delivered reader/content behavior using WCAG2ICT.",
      "web_baseline_procedures": [],
      "documents_baseline_procedures": [],
      "incorporated_wcag20_url": null
    },
    {
      "id": "1.3.5",
      "name": "Identify Input Purpose",
      "level": "AA",
      "introduced_in": "2.1",
      "track": "supplemental-wcag21",
      "normative_url": "https://www.w3.org/TR/WCAG22/#identify-input-purpose",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/identify-input-purpose.html",
      "document_section508_applicability": "supplemental-with-WCAG2ICT-interpretation",
      "development": "Expose the defined input purpose for fields collecting information about the user when the technology supports it.",
      "testing": "Inspect applicable user-data fields against the criterion's input-purpose taxonomy and supported programmatic mechanism.",
      "document_notes": "Evaluate supported native/PDF form properties; document an unsupported mechanism and human interpretation rather than pretending HTML autocomplete exists.",
      "web_baseline_procedures": [],
      "documents_baseline_procedures": [],
      "incorporated_wcag20_url": null
    },
    {
      "id": "1.4.1",
      "name": "Use of Color",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#use-of-color",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html",
      "document_section508_applicability": "content-dependent",
      "development": "Communicate status and distinctions with more than color alone.",
      "testing": "Compare color-coded meaning with text, patterns, symbols or programmatic cues; check links and charts in context.",
      "document_notes": "Use labels and patterns for conditional formatting and charts; do not remove meaningful color when adding another cue.",
      "web_baseline_procedures": [
        "7.A-Color"
      ],
      "documents_baseline_procedures": [
        "7.A-Color"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#visual-audio-contrast-without-color"
    },
    {
      "id": "1.4.2",
      "name": "Audio Control",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#audio-control",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/audio-control.html",
      "document_section508_applicability": "content-dependent",
      "development": "Provide control of automatically playing audio that lasts more than three seconds.",
      "testing": "Trigger automatic playback; verify an appropriate stop/pause or independent volume control and its keyboard operation.",
      "document_notes": "Check embedded media and presentation startup states; ordinary system volume alone is insufficient for the independent-volume option.",
      "web_baseline_procedures": [
        "3.A-NonInterference",
        "21.D-AudioControl"
      ],
      "documents_baseline_procedures": [
        "3.A-NonInterference",
        "21.D-AudioControl"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#visual-audio-contrast-dis-audio"
    },
    {
      "id": "1.4.3",
      "name": "Contrast (Minimum)",
      "level": "AA",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#contrast-minimum",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html",
      "document_section508_applicability": "content-dependent",
      "development": "Choose text/background combinations meeting 4.5:1, or 3:1 for qualifying large text, with the criterion's exceptions.",
      "testing": "Measure actual foreground/background combinations, including states, images of text and gradients; apply large-text and exception definitions.",
      "document_notes": "Check text inside charts, tables, slide masters and exported PDFs, not only body text.",
      "web_baseline_procedures": [
        "8.A-ContrastMinimum"
      ],
      "documents_baseline_procedures": [
        "8.A-ContrastMinimum"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#visual-audio-contrast-contrast"
    },
    {
      "id": "1.4.4",
      "name": "Resize Text",
      "level": "AA",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#resize-text",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html",
      "document_section508_applicability": "content-dependent",
      "development": "Allow text to enlarge to 200 percent without losing content or functionality, subject to criterion exceptions.",
      "testing": "Enlarge text in the delivered environment; inspect clipping, overlap, controls and hidden information.",
      "document_notes": "Use a format-appropriate text-resize method. A page magnifier alone is not proof of text-resize support; record reader limitations.",
      "web_baseline_procedures": [
        "22.A-ResizeText"
      ],
      "documents_baseline_procedures": [
        "22.A-ResizeText"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#visual-audio-contrast-scale"
    },
    {
      "id": "1.4.5",
      "name": "Images of Text",
      "level": "AA",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#images-of-text",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/images-of-text.html",
      "document_section508_applicability": "content-dependent",
      "development": "Use real text rather than images of text when the technology can achieve the presentation, subject to customizable/essential exceptions.",
      "testing": "Identify text rendered as images; check whether real text can achieve the result and whether a stated exception actually applies.",
      "document_notes": "OCR can restore text availability but does not automatically repair relationships, reading order or image-of-text issues.",
      "web_baseline_procedures": [
        "6.D-ImageText"
      ],
      "documents_baseline_procedures": [
        "6.D-ImageText"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#visual-audio-contrast-text-presentation"
    },
    {
      "id": "1.4.10",
      "name": "Reflow",
      "level": "AA",
      "introduced_in": "2.1",
      "track": "supplemental-wcag21",
      "normative_url": "https://www.w3.org/TR/WCAG22/#reflow",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/reflow.html",
      "document_section508_applicability": "supplemental-with-WCAG2ICT-interpretation",
      "development": "Support reflow without two-dimensional scrolling at the criterion's 320 CSS-pixel width or 256 CSS-pixel height equivalent, with the stated two-dimensional-layout exception.",
      "testing": "Test the applicable narrow/zoomed view; check that information and functionality remain, and limit any exception to content requiring two-dimensional layout.",
      "document_notes": "Test the actual document reader's reflow and content. A table or sheet may qualify for a two-dimensional exception; that does not exempt unrelated text or the entire document.",
      "web_baseline_procedures": [],
      "documents_baseline_procedures": [],
      "incorporated_wcag20_url": null
    },
    {
      "id": "1.4.11",
      "name": "Non-text Contrast",
      "level": "AA",
      "introduced_in": "2.1",
      "track": "supplemental-wcag21",
      "normative_url": "https://www.w3.org/TR/WCAG22/#non-text-contrast",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html",
      "document_section508_applicability": "supplemental-with-WCAG2ICT-interpretation",
      "development": "Provide 3:1 contrast for required visual control/state and meaningful graphic information against adjacent colors, with criterion exceptions.",
      "testing": "Measure boundaries, state indicators and meaningful graphical parts; distinguish essential information from decorative detail and unmodified user-agent styling.",
      "document_notes": "Check chart distinctions, author-provided form borders and focus indicators; assess reader-owned controls separately.",
      "web_baseline_procedures": [],
      "documents_baseline_procedures": [],
      "incorporated_wcag20_url": null
    },
    {
      "id": "1.4.12",
      "name": "Text Spacing",
      "level": "AA",
      "introduced_in": "2.1",
      "track": "supplemental-wcag21",
      "normative_url": "https://www.w3.org/TR/WCAG22/#text-spacing",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html",
      "document_section508_applicability": "supplemental-with-WCAG2ICT-interpretation",
      "development": "Avoid loss when users set line height to 1.5 times font size, paragraph spacing to 2 times, letter spacing to .12 times and word spacing to .16 times.",
      "testing": "Apply the specified spacing settings where applicable; inspect clipping, overlap and loss of functionality while preserving other styles.",
      "document_notes": "Interpret with WCAG2ICT for the format; document technology/reader support and applicable language exceptions instead of inventing HTML styling controls.",
      "web_baseline_procedures": [],
      "documents_baseline_procedures": [],
      "incorporated_wcag20_url": null
    },
    {
      "id": "1.4.13",
      "name": "Content on Hover or Focus",
      "level": "AA",
      "introduced_in": "2.1",
      "track": "supplemental-wcag21",
      "normative_url": "https://www.w3.org/TR/WCAG22/#content-on-hover-or-focus",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/content-on-hover-or-focus.html",
      "document_section508_applicability": "supplemental-with-WCAG2ICT-interpretation",
      "development": "Make qualifying author-controlled hover/focus content dismissible, hoverable and persistent, with the criterion's exceptions.",
      "testing": "Reveal the content by pointer and keyboard; try dismissing it, moving into it and keeping it open until the trigger ends or it is dismissed.",
      "document_notes": "Evaluate author-created popups and tooltips; distinguish reader-controlled presentation and its responsible software.",
      "web_baseline_procedures": [],
      "documents_baseline_procedures": [],
      "incorporated_wcag20_url": null
    },
    {
      "id": "2.1.1",
      "name": "Keyboard",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#keyboard",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html",
      "document_section508_applicability": "content-dependent",
      "development": "Provide keyboard access to all functionality without timing individual keystrokes, subject to the path-dependent-input exception.",
      "testing": "Exercise every function with keyboard alone, including hidden/expanded controls and equivalent controls; check keystroke timing.",
      "document_notes": "Use the intended reading/presentation mode and test content interactions separately from the authoring application's ribbon.",
      "web_baseline_procedures": [
        "1.A-KeyboardAccess"
      ],
      "documents_baseline_procedures": [
        "1.A-KeyboardAccess"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#keyboard-operation-keyboard-operable"
    },
    {
      "id": "2.1.2",
      "name": "No Keyboard Trap",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#no-keyboard-trap",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/no-keyboard-trap.html",
      "document_section508_applicability": "content-dependent",
      "development": "Allow keyboard focus to leave every component, with instructions for any nonstandard exit keys.",
      "testing": "Navigate into and out of every interactive region in both directions; verify any documented exit mechanism.",
      "document_notes": "Include PDF forms, embedded objects and slide media; absence of controls may justify non-applicability only after inspection.",
      "web_baseline_procedures": [
        "1.B-NoKeyboardTrap",
        "3.A-NonInterference"
      ],
      "documents_baseline_procedures": [
        "1.B-NoKeyboardTrap",
        "3.A-NonInterference"
      ],
      "incorporated_wcag20_url": "https://www.w3.org/TR/2008/REC-WCAG20-20081211/#keyboard-operation-trapping"
    },
    {
      "id": "2.1.4",
      "name": "Character Key Shortcuts",
      "level": "A",
      "introduced_in": "2.1",
      "track": "supplemental-wcag21",
      "normative_url": "https://www.w3.org/TR/WCAG22/#character-key-shortcuts",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/character-key-shortcuts.html",
      "document_section508_applicability": "supplemental-with-WCAG2ICT-interpretation",
      "development": "Allow single-character shortcuts to be disabled or remapped, or limit them to focused components as specified.",
      "testing": "Exercise character shortcuts with and without component focus; verify an allowed mitigation.",
      "document_notes": "Check author-created macros or content interactions, not unrelated reader/global shortcuts.",
      "web_baseline_procedures": [],
      "documents_baseline_procedures": [],
      "incorporated_wcag20_url": null
    },
    {
      "id": "2.2.1",
      "name": "Timing Adjustable",
      "level": "A",
      "introduced_in": "2.0",
      "track": "section508",
      "normative_url": "https://www.w3.org/TR/WCAG22/#timing-adjustable",
      "understanding_url": "https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html",
      "document_section508_applicability": "content-dependent",
      "development": "Allow users to turn off, adjust or extend content time limits under one of the criterion's permitted options or exceptions.",
      "testing": "Find time limits and exercise the selected option; for extension verify the warning interval and allowed repetitions against the normative criterion.",
      "document_notes": "Include timed slides, forms and linked completion processes; check real-time/essential exceptions explicitly.",
