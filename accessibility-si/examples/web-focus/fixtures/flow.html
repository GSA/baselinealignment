<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus exercise</title>
<style>
body { margin:0; font-family:system-ui,sans-serif; color:#111; background:#fff; }
main { padding:24px; }
a { color:#004b80; }
a:focus-visible, button:focus-visible { outline:3px solid #005ea8; outline-offset:3px; }
.panel { position:static; margin-top:100px; padding:24px; background:#eee; }
.action { position:absolute; top:120px; left:24px; padding:12px; }
</style></head><body>
<main><h1>Service information</h1><p>Use the keyboard to reach the service link and the next control.</p>
<a class="action" href="#details">Read service details</a>
<div class="panel">Service notice: contact hours are 9 a.m. to 5 p.m.</div>
<section id="details" style="margin-top:240px"><h2>Service details</h2><button type="button">Contact options</button></section>
</main></body></html>
